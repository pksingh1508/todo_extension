<!DOCTYPE html>
<html lang="en" data-theme="dark" data-board="todo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>New Tab</title>
    <link rel="icon" href="icons/icon-32.png" />
    <script src="boot.js"></script>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-logo" viewBox="0 0 24 24">
        <rect x="3.5" y="4" width="4.6" height="13" rx="1.6" />
        <rect x="9.7" y="4" width="4.6" height="9.5" rx="1.6" opacity=".92" />
        <rect x="15.9" y="4" width="4.6" height="6" rx="1.6" opacity=".84" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="13" height="13" rx="2.5" />
        <path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18" />
        <path d="M19 6v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5Z" /></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></symbol>
      <symbol id="i-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3" />
        <path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5" />
        <path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="m7 10 5 5 5-5" />
        <path d="M12 15V3" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="m17 8-5-5-5 5" />
        <path d="M12 3v12" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M15 3h6v6" />
        <path d="M10 14 21 3" />
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
        <path d="M12 9v4M12 17h.01" />
      </symbol>
      <symbol id="i-return" viewBox="0 0 24 24">
        <path d="m9 10-5 5 5 5" />
        <path d="M20 4v7a4 4 0 0 1-4 4H4" />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8" />
      </symbol>
      <symbol id="i-target" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <circle cx="12" cy="12" r="5" />
        <circle cx="12" cy="12" r="1" />
      </symbol>
    </svg>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon icon-fill"><use href="#i-logo" /></svg>
          </span>
          <div class="brand-copy">
            <h1 class="brand-name">Task Planner</h1>
            <p class="brand-date" id="today"></p>
          </div>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <svg class="icon composer-icon" aria-hidden="true"><use href="#i-plus" /></svg>
          <input
            class="composer-input"
            id="composerInput"
            type="text"
            maxlength="2000"
            placeholder="Add a task…"
            aria-label="Add a task"
            enterkeyhint="done"
          />
          <kbd class="composer-kbd" aria-hidden="true" title="Press / to add">/</kbd>
          <button class="composer-submit" type="submit">
            Add
            <svg class="icon" aria-hidden="true"><use href="#i-return" /></svg>
          </button>
        </form>

        <div class="topbar-actions">
          <div class="segmented" role="tablist" aria-label="Board">
            <span class="segmented-indicator" aria-hidden="true"></span>
            <button class="segmented-btn" type="button" role="tab" data-board="todo" aria-selected="true">
              <svg class="icon" aria-hidden="true"><use href="#i-list" /></svg>
              Tasks
              <span class="segmented-count" id="countTasks"></span>
            </button>
            <button class="segmented-btn" type="button" role="tab" data-board="goal" aria-selected="false">
              <svg class="icon" aria-hidden="true"><use href="#i-target" /></svg>
              Goals
              <span class="segmented-count" id="countGoals"></span>
            </button>
          </div>

          <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme" title="Switch theme">
            <svg class="icon theme-sun" aria-hidden="true"><use href="#i-sun" /></svg>
            <svg class="icon theme-moon" aria-hidden="true"><use href="#i-moon" /></svg>
          </button>
          <button
            class="icon-btn"
            id="dataBtn"
            type="button"
            popovertarget="dataPanel"
            aria-label="Your data and backups"
            title="Your data and backups"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-database" /></svg>
          </button>
          <button
            class="icon-btn popup-only"
            id="openFullBtn"
            type="button"
            aria-label="Open the full board in a tab"
            title="Open the full board in a tab"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-external" /></svg>
          </button>
        </div>
      </header>

      <nav class="column-tabs" id="columnTabs" aria-label="Columns">
        <span class="column-tabs-indicator" aria-hidden="true"></span>
        <button class="column-tab" type="button" data-status="todo" aria-selected="true">
          <span class="column-tab-dot" aria-hidden="true"></span>
          <span class="column-tab-label">To Do</span>
          <span class="column-tab-count">0</span>
        </button>
        <button class="column-tab" type="button" data-status="progress" aria-selected="false">
          <span class="column-tab-dot" aria-hidden="true"></span>
          <span class="column-tab-label">In Progress</span>
          <span class="column-tab-count">0</span>
        </button>
        <button class="column-tab" type="button" data-status="done" aria-selected="false">
          <span class="column-tab-dot" aria-hidden="true"></span>
          <span class="column-tab-label">Done</span>
          <span class="column-tab-count">0</span>
        </button>
      </nav>

      <main class="board" id="board" data-column="todo">
        <section class="column" data-status="todo" aria-labelledby="columnTitleTodo">
          <header class="column-head">
            <span class="column-dot" aria-hidden="true"></span>
            <h2 class="column-title" id="columnTitleTodo">To Do</h2>
            <span class="column-count">0</span>
          </header>
          <div class="column-body"></div>
        </section>

        <section class="column" data-status="progress" aria-labelledby="columnTitleProgress">
          <header class="column-head">
            <span class="column-dot" aria-hidden="true"></span>
            <h2 class="column-title" id="columnTitleProgress">In Progress</h2>
            <span class="column-count">0</span>
          </header>
          <div class="column-body"></div>
        </section>

        <section class="column" data-status="done" aria-labelledby="columnTitleDone">
          <header class="column-head">
            <span class="column-dot" aria-hidden="true"></span>
            <h2 class="column-title" id="columnTitleDone">Done</h2>
            <span class="column-count">0</span>
          </header>
          <div class="column-body"></div>
        </section>
      </main>
    </div>

    <div class="panel" id="dataPanel" popover>
      <div class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-shield" /></svg>
        <h2 class="panel-title">Your data</h2>
        <button
          class="icon-btn icon-btn-sm"
          type="button"
          popovertarget="dataPanel"
          popovertargetaction="hide"
          aria-label="Close"
        >
          <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="panel-body" id="dataPanelBody"></div>
    </div>

    <input
      id="restoreInput"
      type="file"
      accept=".json,.sqlite3,.sqlite,.db,application/json"
      hidden
    />
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <template id="cardTemplate">
      <article class="card" draggable="true">
        <button class="card-check" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-check" /></svg>
        </button>
        <p class="card-text"></p>
        <div class="card-actions">
          <button class="card-btn" type="button" data-action="progress">
            <svg class="icon" aria-hidden="true"><use href="#i-play" /></svg>
          </button>
          <button class="card-btn" type="button" data-action="copy" title="Copy text" aria-label="Copy text">
            <svg class="icon" aria-hidden="true"><use href="#i-copy" /></svg>
          </button>
          <button class="card-btn" type="button" data-action="edit" title="Edit" aria-label="Edit">
            <svg class="icon" aria-hidden="true"><use href="#i-pencil" /></svg>
          </button>
          <button class="card-btn" type="button" data-action="delete" title="Delete" aria-label="Delete">
            <svg class="icon" aria-hidden="true"><use href="#i-trash" /></svg>
          </button>
        </div>
      </article>
    </template>

    <script src="vendor/sql.js/sql-wasm.js"></script>
    <script src="sqlite-store.js"></script>
    <script src="backup.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
